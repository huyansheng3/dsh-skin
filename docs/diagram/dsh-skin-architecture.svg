<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .region-label { font-size: 12px; font-weight: 700; }
    .name { fill: #f8fafc; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .desc { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
    .edge-label { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
    .note { fill: #94a3b8; font-size: 10px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#0f172a"/>
  <rect width="1400" height="900" fill="url(#grid)"/>

  <text x="40" y="43" class="title">dsh-skin 双端 Cordis 架构</text>
  <text x="40" y="66" class="subtitle">浏览器负责原生设置交互，Host 负责可信状态、主题资源与安全边界</text>

  <rect x="40" y="95" width="1320" height="225" rx="14" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="9,5"/>
  <text x="58" y="119" class="region-label" fill="#22d3ee">浏览器 / DeepSeek Harness Web</text>

  <rect x="76" y="162" width="170" height="70" rx="7" fill="#0f172a"/>
  <rect x="76" y="162" width="170" height="70" rx="7" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="161" y="190" class="name">用户</text>
  <text x="161" y="209" class="desc">选择、停用或导入主题</text>

  <rect x="304" y="145" width="210" height="104" rx="7" fill="#0f172a"/>
  <rect x="304" y="145" width="210" height="104" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="409" y="178" class="name">Harness 原生设置</text>
  <text x="409" y="198" class="desc">settings.section 皮肤库 Tab</text>
  <text x="409" y="216" class="desc">设置窗口与交互仍归宿主管</text>

  <rect x="572" y="145" width="210" height="104" rx="7" fill="#0f172a"/>
  <rect x="572" y="145" width="210" height="104" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="677" y="178" class="name">dsh-skin Client</text>
  <text x="677" y="198" class="desc">读取库存、提交选择与 ZIP</text>
  <text x="677" y="216" class="desc">只调用同源 Host API</text>

  <rect x="840" y="145" width="210" height="104" rx="7" fill="#0f172a"/>
  <rect x="840" y="145" width="210" height="104" rx="7" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="945" y="178" class="name">主题样式链接</text>
  <text x="945" y="198" class="desc">稳定 link + 版本化缓存键</text>
  <text x="945" y="216" class="desc">切换时只更新 href</text>

  <rect x="1108" y="145" width="210" height="104" rx="7" fill="#0f172a"/>
  <rect x="1108" y="145" width="210" height="104" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1213" y="178" class="name">原生 Harness UI</text>
  <text x="1213" y="198" class="desc">真实 DOM、弹窗与 portal</text>
  <text x="1213" y="216" class="desc">背景层始终不可交互</text>

  <line x1="246" y1="197" x2="294" y2="197" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="514" y1="197" x2="562" y2="197" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="1050" y1="197" x2="1098" y2="197" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="365" width="1320" height="230" rx="14" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="9,5"/>
  <text x="58" y="389" class="region-label" fill="#34d399">Cordis Host / webServer 存在时才启用</text>

  <rect x="78" y="435" width="190" height="86" rx="7" fill="#0f172a"/>
  <rect x="78" y="435" width="190" height="86" rx="7" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="173" y="468" class="name">DSH Web Loader</text>
  <text x="173" y="489" class="desc">加载 Host 与 Client 入口</text>

  <rect x="338" y="419" width="230" height="118" rx="7" fill="#0f172a"/>
  <rect x="338" y="419" width="230" height="118" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="453" y="456" class="name">Host 协调器</text>
  <text x="453" y="478" class="desc">解析生效主题与缓存身份</text>
  <text x="453" y="497" class="desc">注册路由并向首页注入 link</text>

  <rect x="638" y="419" width="230" height="118" rx="7" fill="#0f172a"/>
  <rect x="638" y="419" width="230" height="118" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="753" y="456" class="name">同源管理 API</text>
  <text x="753" y="478" class="desc">库存、激活、停用、ZIP 导入</text>
  <text x="753" y="497" class="desc">跨源写操作直接拒绝</text>

  <rect x="938" y="419" width="230" height="118" rx="7" fill="#0f172a"/>
  <rect x="938" y="419" width="230" height="118" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1053" y="456" class="name">CSS 与背景路由</text>
  <text x="1053" y="478" class="desc">输出主题变量、自定义样式</text>
  <text x="1053" y="497" class="desc">以及当前背景资源</text>

  <line x1="268" y1="478" x2="328" y2="478" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="568" y1="478" x2="628" y2="478" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="868" y1="478" x2="928" y2="478" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <path d="M677 249 L677 337 L753 337 L753 409" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="724" y="331" class="edge-label">同源请求</text>
  <path d="M1053 409 L1053 338 L945 338 L945 259" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1012" y="331" class="edge-label">CSS / 背景</text>

  <rect x="40" y="640" width="1320" height="205" rx="14" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="9,5"/>
  <text x="58" y="664" class="region-label" fill="#a78bfa">策略与本地数据</text>

  <rect x="90" y="706" width="230" height="96" rx="7" fill="#0f172a"/>
  <rect x="90" y="706" width="230" height="96" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="205" y="741" class="name">Theme Manager</text>
  <text x="205" y="762" class="desc">主题发现、状态与有界 ZIP 导入</text>
  <text x="205" y="780" class="desc">用户主题同 ID 时优先</text>

  <rect x="400" y="706" width="230" height="96" rx="7" fill="#0f172a"/>
  <rect x="400" y="706" width="230" height="96" rx="7" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="515" y="741" class="name">Safe CSS / Renderer</text>
  <text x="515" y="762" class="desc">白名单校验与主题 CSS 生成</text>
  <text x="515" y="780" class="desc">不接管页面布局和交互</text>

  <g transform="translate(718,705)">
    <rect x="0" y="12" width="220" height="72" fill="#0f172a"/>
    <ellipse cx="110" cy="12" rx="110" ry="13" fill="#0f172a"/>
    <ellipse cx="110" cy="84" rx="110" ry="13" fill="#0f172a"/>
    <rect x="0" y="12" width="220" height="72" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="110" cy="12" rx="110" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="110" cy="84" rx="110" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="84" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="220" y1="12" x2="220" y2="84" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="110" y="48" class="name">用户主题库 + state.json</text>
    <text x="110" y="67" class="desc">当前选择与 revision</text>
  </g>

  <g transform="translate(1030,705)">
    <rect x="0" y="12" width="250" height="72" fill="#0f172a"/>
    <ellipse cx="125" cy="12" rx="125" ry="13" fill="#0f172a"/>
    <ellipse cx="125" cy="84" rx="125" ry="13" fill="#0f172a"/>
    <rect x="0" y="12" width="250" height="72" fill="rgba(120,53,15,0.3)"/>
    <ellipse cx="125" cy="12" rx="125" ry="13" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <ellipse cx="125" cy="84" rx="125" ry="13" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="84" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="250" y1="12" x2="250" y2="84" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="125" y="48" class="name">随包主题 / 本地 Gallery</text>
    <text x="125" y="67" class="desc">公开 20+2，本地可物化 76</text>
  </g>

  <path d="M453 547 L453 626 L205 626 L205 696" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <path d="M1053 547 L1053 620 L515 620 L515 696" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M753 547 L753 610 L205 610 L205 696" fill="none" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)"/>
  <path d="M828 812 L828 821 L205 821 L205 812" fill="none" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)"/>
  <path d="M1155 812 L1155 834 L205 834 L205 812" fill="none" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="40" y="875" class="note">边界：不修改 Harness 安装包；无 webServer 时 no-op；背景层 pointer-events: none；原生 DOM 和 portal 始终由 Harness 管理。</text>
</svg>
